<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround</title>
<style>
:root{color-scheme:dark} *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 20% 20%,#1b2a4a,#0b1020 60%);color:#e8eefc} main{text-align:center;padding:2rem} h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 .5rem;letter-spacing:.02em} p{opacity:.8;max-width:40ch;margin:0 auto 1.5rem} button{padding:.9rem 1.6rem;font-size:1rem;border:0;border-radius:.75rem;background:linear-gradient(135deg,#4f8cff,#7c5cff);color:#fff;cursor:pointer} button:hover{filter:brightness(1.1)} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:2rem;max-width:320px;margin-inline:auto} .cell{aspect-ratio:1;border-radius:.5rem;background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<main>
<h1>PlayGround</h1>
<p>A live preview served from the project build output.</p>
<button type="button">Start game</button>
<div class="grid" aria-hidden="true">
<div class="cell"></div><div class="cell"></div><div class="cell"></div>
<div class="cell"></div><div class="cell"></div><div class="cell"></div>
<div class="cell"></div><div class="cell"></div><div class="cell"></div>
</div>
</main>
</body>
</html>
